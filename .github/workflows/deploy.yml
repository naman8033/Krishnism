name: Deploy Krishnism Storefront to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Supabase Config
        run: |
          cat << 'EOF' > supabase-config.js
          window.KRISHNISM_SUPABASE = {
            url: '${{ secrets.SUPABASE_URL || 'https://otlcarblkkuftzyxakfc.supabase.co' }}',
            publishableKey: '${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_kXu0LNQ0bYsYOhB1aAF0Hg_f0nbMrTj' }}',
            defaultUpiId: '${{ secrets.DEFAULT_UPI_ID || 'naman8080@ybl' }}',
            defaultUpiName: 'Krishnism'
          };
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
